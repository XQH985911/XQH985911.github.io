<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>404 - Qihang Xu</title>

  <meta name="author" content="Qihang Xu">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" type="text/css" href="stylesheet.css">

  <style>
    name {
      font-size: 72px;
    }
  </style>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
</head>

<body>
  <!-- Dark Mode Toggle -->
  <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>

  <table
    style="width:100%;max-width:800px;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;">
    <tbody>
      <tr style="padding:0px">
        <td style="padding:0px">
          <!-- ====== 404 Card ====== -->
          <table class="section"
            style="width:100%;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;">
            <tbody>
              <tr>
                <td style="padding:60px 20px;text-align:center;vertical-align:middle">
                  <p style="margin:0">
                    <name>404</name>
                  </p>
                  <p style="font-size:18px;margin-top:20px">
                    Oops! The page you are looking for does not exist.
                  </p>
                  <p style="margin-top:30px">
                    <a href="index.html">&larr; Back to Home</a>
                  </p>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Theme Toggle Script -->
  <script>
    (function() {
      const html = document.documentElement;
      const toggleBtn = document.getElementById('theme-toggle');

      // Apply saved theme (only if user has manually chosen before)
      const saved = localStorage.getItem('theme');
      if (saved) {
        html.setAttribute('data-theme', saved);
      }
      // If no saved theme, don't set attribute → CSS @media handles system preference

      // Get effective theme (manual > system)
      function getEffectiveTheme() {
        if (html.hasAttribute('data-theme')) {
          return html.getAttribute('data-theme');
        }
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function updateIcon() {
        toggleBtn.textContent = getEffectiveTheme() === 'dark' ? '☀️' : '🌙';
      }
      updateIcon();

      // Toggle on click
      toggleBtn.addEventListener('click', function() {
        const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateIcon();
      });
    })();
  </script>
</body>

</html>
